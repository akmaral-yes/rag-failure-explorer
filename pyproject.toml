[project]
name = "rag-failure-explorer"
version = "0.1.0"
description = "Interactive comparison of 5 RAG retrieval strategies, showing when each one wins or fails"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gradio==6.26.0",
    "langchain-chroma==1.1.0",
    "langchain-classic==1.0.8",
    "langchain-community==0.4.2",
    "langchain-openai==1.6.0",
    "langchain-text-splitters==1.1.2",
    "python-dotenv==1.2.3",
    "rank-bm25==0.2.2",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.6",
]

[tool.pytest.ini_options]
markers = [
    "integration: tests that make real OpenAI API calls (embeddings/LLM)",
]
